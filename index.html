<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中職業試探授課教師一覽表編輯器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f3f4f6;
        }

        /* 隱藏數字輸入框的上下箭頭以確保絕對置中不偏移 */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        /* 強制置中樣式 */
        .text-center {
            text-align: center !important;
        }

        /* A4 直式列印樣式優化 */
        @media print {
            @page {
                size: A4 portrait;
                margin: 1cm !important;
            }
            body {
                background-color: #ffffff;
                color: #000000;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-border-thick {
                border: 2px solid #000000 !important;
            }
            .print-border-thin {
                border: 1px solid #000000 !important;
            }
            /* 調整直式列印的文字縮放與表格緊湊度，避免溢出直式 A4 寬度 */
            table {
                border-collapse: collapse !important;
                width: 100% !important;
                font-size: 11px !important; /* 縮小字型以適應直式 A4 寬度 */
            }
            th, td {
                border: 1px solid #000000 !important;
                padding: 4px 2px !important;
            }
            input, textarea, select {
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
                padding: 0 !important;
                resize: none !important;
                -webkit-appearance: none;
                -moz-appearance: none;
                appearance: none;
                font-size: 11px !important;
            }
            input::placeholder, textarea::placeholder {
                color: transparent !important;
            }
            .print-title-input {
                font-size: 20px !important;
            }
            .print-underline {
                border-bottom: 1px solid #000000 !important;
                display: inline-block;
                min-width: 60px;
                text-align: center;
            }
            /* 確保列印時人數等置中欄位依然生效 */
            .text-center {
                text-align: center !important;
            }
            input.text-center {
                text-align: center !important;
            }
        }

        /* 網頁版輸入框隱藏預設樣式以便融入表格 */
        .table-input {
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
            padding: 6px;
            text-align: center;
            transition: all 0.2s;
        }
        .table-input:focus {
            background-color: #f0fdf4;
            box-shadow: inset 0 0 0 2px #22c55e;
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="app"></div>

    <!-- Firebase App & Firestore v9 (Compat version for easier integration) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- React and Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // ==========================================
        // 🔗 請在此填入您的 Google Apps Script (GAS) 部署網址 🔗
        // ==========================================
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz35TlzitUT_syhVv0MGu730o4Oe-8OadPSa0XnIpZ-U4Ph8P8QimPYzklx-t6QUrL0mg/exec";

        // 計算星期工具
        const getWeekdayName = (dateStr, short = false) => {
            if (!dateStr) return "";
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return "";
            const weekdays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const shortWeekdays = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
            return short ? shortWeekdays[date.getDay()] : weekdays[date.getDay()];
        };

        // 西元轉民國日期字串格式化工具
        const formatROCDisplay = (dateStr, timeSlot) => {
            if (!dateStr) return { date: "＿＿.＿＿.＿＿", time: "(未指定時間)" };
            const parts = dateStr.split('-');
            if (parts.length !== 3) return { date: dateStr, time: `(${timeSlot})` };
            const year = parseInt(parts[0], 10) - 1911;
            const month = parseInt(parts[1], 10);
            const day = parseInt(parts[2], 10);
            const weekday = getWeekdayName(dateStr);
            
            return {
                date: `${year}.${month}.${day}`,
                time: `(${weekday} ${timeSlot || ''})`
            };
        };

        // 統計分析圖表組件
        function AnalyticsView({ historyList }) {
            const [dimension, setDimension] = useState("group"); // 'group' | 'school' | 'branch' | 'academicYear'
            const [selectedYear, setSelectedYear] = useState("all");

            useEffect(() => {
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            }, [dimension, selectedYear, historyList]);

            // 取得所有登場過的學年度列表供篩選
            const availableYears = Array.from(new Set(historyList.map(item => item.academicYear))).filter(Boolean).sort();

            // 依據篩選條件計算統計數據
            const filteredHistory = historyList.filter(item => {
                if (selectedYear !== "all" && item.academicYear !== selectedYear) return false;
                return true;
            });

            // 指標卡片數據
            const totalStudents = filteredHistory.reduce((acc, h) => acc + (parseInt(h.totalStudents, 10) || 0), 0);
            const uniqueSchoolsCount = new Set(filteredHistory.map(h => h.schoolName)).size;
            const totalBatches = filteredHistory.length;
            const avgStudentsPerBatch = totalBatches > 0 ? Math.round(totalStudents / totalBatches) : 0;

            // 計算長條圖分類數據
            const aggregateData = () => {
                const map = {};
                filteredHistory.forEach(item => {
                    if (dimension === 'school') {
                        const key = `${item.schoolName}國中`;
                        map[key] = (map[key] || 0) + (parseInt(item.totalStudents, 10) || 0);
                    } else if (dimension === 'academicYear') {
                        const key = `${item.academicYear}學年度`;
                        map[key] = (map[key] || 0) + (parseInt(item.totalStudents, 10) || 0);
                    } else if (dimension === 'group' || dimension === 'branch') {
                        (item.rows || []).forEach(r => {
                            const key = dimension === 'group' 
                                ? (r.group?.trim() || "未填寫職群") 
                                : (r.branch?.trim() || "未填寫科別");
                            map[key] = (map[key] || 0) + (parseInt(r.count, 10) || 0);
                        });
                    }
                });

                return Object.keys(map).map(k => ({
                    label: k,
                    value: map[k]
                })).sort((a, b) => b.value - a.value);
            };

            const chartData = aggregateData();
            const maxValue = chartData.length > 0 ? Math.max(...chartData.map(d => d.value)) : 1;

            // 漸層顏色對應
            const dimensionLabels = {
                group: '按職群統計',
                school: '按合作國中統計',
                branch: '按科別統計',
                academicYear: '按學年度統計'
            };

            return (
                <div class="no-print animate-fadeIn space-y-6">
                    {/* 數據總覽 KPI 卡片 */}
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-gradient-to-br from-green-50 to-emerald-100/60 border border-green-200 p-4 rounded-xl flex items-center gap-4">
                            <div class="bg-green-600 text-white p-3 rounded-lg shadow-sm">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-green-800">總參與學生人數</p>
                                <p class="text-2xl font-bold text-green-900 mt-0.5">{totalStudents.toLocaleString()} <span class="text-xs font-normal">人</span></p>
                            </div>
                        </div>

                        <div class="bg-gradient-to-br from-blue-50 to-indigo-100/60 border border-blue-200 p-4 rounded-xl flex items-center gap-4">
                            <div class="bg-blue-600 text-white p-3 rounded-lg shadow-sm">
                                <i data-lucide="building-2" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-blue-800">合作國中校數</p>
                                <p class="text-2xl font-bold text-blue-900 mt-0.5">{uniqueSchoolsCount} <span class="text-xs font-normal">所</span></p>
                            </div>
                        </div>

                        <div class="bg-gradient-to-br from-purple-50 to-purple-100/60 border border-purple-200 p-4 rounded-xl flex items-center gap-4">
                            <div class="bg-purple-600 text-white p-3 rounded-lg shadow-sm">
                                <i data-lucide="file-check" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-purple-800">累積試探梯次數</p>
                                <p class="text-2xl font-bold text-purple-900 mt-0.5">{totalBatches} <span class="text-xs font-normal">場次</span></p>
                            </div>
                        </div>

                        <div class="bg-gradient-to-br from-amber-50 to-amber-100/60 border border-amber-200 p-4 rounded-xl flex items-center gap-4">
                            <div class="bg-amber-600 text-white p-3 rounded-lg shadow-sm">
                                <i data-lucide="calculator" class="w-6 h-6"></i>
                            </div>
                            <div>
                                <p class="text-xs font-semibold text-amber-800">平均每場試探人數</p>
                                <p class="text-2xl font-bold text-amber-900 mt-0.5">{avgStudentsPerBatch} <span class="text-xs font-normal">人/場</span></p>
                            </div>
                        </div>
                    </div>

                    {/* 控制選項與統計長條圖 */}
                    <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-xs">
                        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 pb-4 border-b border-slate-100">
                            <div>
                                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                                    <i data-lucide="bar-chart-3" class="w-5 h-5 text-green-600"></i>
                                    職業試探參與人數統計圖表
                                </h2>
                                <p class="text-xs text-slate-500 mt-0.5">點選下方分類按鈕可切換統計視角與趨勢分析</p>
                            </div>

                            {/* 控制工具列 */}
                            <div class="flex flex-wrap items-center gap-2">
                                <span class="text-xs font-semibold text-slate-500 flex items-center gap-1">
                                    <i data-lucide="filter" class="w-3.5 h-3.5"></i> 學年度篩選：
                                </span>
                                <select 
                                    value={selectedYear}
                                    onChange={(e) => setSelectedYear(e.target.value)}
                                    class="text-xs bg-slate-50 border border-slate-300 rounded-lg px-2.5 py-1.5 font-medium outline-none focus:border-green-500"
                                >
                                    <option value="all">全部學年度</option>
                                    {availableYears.map(yr => (
                                        <option key={yr} value={yr}>{yr} 學年度</option>
                                    ))}
                                </select>
                            </div>
                        </div>

                        {/* 維度切換按鈕組 */}
                        <div class="flex flex-wrap gap-2 mb-6">
                            {Object.entries(dimensionLabels).map(([key, label]) => (
                                <button
                                    key={key}
                                    onClick={() => setDimension(key)}
                                    class={`px-4 py-2 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${
                                        dimension === key
                                            ? 'bg-green-600 text-white shadow-sm'
                                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                                    }`}
                                >
                                    {label}
                                </button>
                            ))}
                        </div>

                        {/* 長條圖本體 (Horizontal Bar Chart) */}
                        {chartData.length === 0 ? (
                            <div class="text-center py-12 border-2 border-dashed border-slate-200 rounded-xl">
                                <i data-lucide="pie-chart" class="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                                <p class="text-slate-500 text-sm font-medium">尚無足夠的歷史資料可供統計分析</p>
                            </div>
                        ) : (
                            <div class="space-y-4">
                                {chartData.map((item, idx) => {
                                    const percentage = totalStudents > 0 ? ((item.value / totalStudents) * 100).toFixed(1) : 0;
                                    const barWidthPercentage = maxValue > 0 ? (item.value / maxValue) * 100 : 0;

                                    return (
                                        <div key={idx} class="group">
                                            <div class="flex justify-between items-center text-xs font-semibold mb-1">
                                                <span class="text-slate-700 flex items-center gap-2">
                                                    <span class="w-5 h-5 rounded-full bg-slate-100 text-slate-600 text-[10px] flex items-center justify-center font-bold">
                                                        {idx + 1}
                                                    </span>
                                                    {item.label}
                                                </span>
                                                <span class="text-slate-600 font-mono">
                                                    <strong class="text-green-700 text-sm">{item.value.toLocaleString()}</strong> 人 
                                                    <span class="text-slate-400 font-normal ml-1">({percentage}%)</span>
                                                </span>
                                            </div>

                                            {/* 動態動畫條 */}
                                            <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden p-0.5 border border-slate-200">
                                                <div 
                                                    class="bg-gradient-to-r from-emerald-500 to-green-600 h-full rounded-full transition-all duration-700 ease-out flex items-center justify-end pr-2"
                                                    style={{ width: `${Math.max(barWidthPercentage, 3)}%` }}
                                                >
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        )}

                        {/* 統計資料表格 */}
                        {chartData.length > 0 && (
                            <div class="mt-8 pt-6 border-t border-slate-200">
                                <h3 class="text-xs font-bold text-slate-600 mb-3 flex items-center gap-1.5">
                                    <i data-lucide="table" class="w-4 h-4 text-slate-500"></i>
                                    統計數據明細對照表
                                </h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-xs text-left border-collapse border border-slate-200">
                                        <thead>
                                            <tr class="bg-slate-50 text-slate-700">
                                                <th class="border border-slate-200 p-2 text-center w-12">排名</th>
                                                <th class="border border-slate-200 p-2">項目名稱</th>
                                                <th class="border border-slate-200 p-2 text-center">累計人數</th>
                                                <th class="border border-slate-200 p-2 text-center">佔總數比例</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {chartData.map((item, index) => (
                                                <tr key={index} class="hover:bg-slate-50">
                                                    <td class="border border-slate-200 p-2 text-center font-bold text-slate-500">{index + 1}</td>
                                                    <td class="border border-slate-200 p-2 font-semibold text-slate-800">{item.label}</td>
                                                    <td class="border border-slate-200 p-2 text-center font-bold text-green-700">{item.value.toLocaleString()} 人</td>
                                                    <td class="border border-slate-200 p-2 text-center font-mono text-slate-600">
                                                        {((item.value / totalStudents) * 100).toFixed(1)}%
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        function App() {
            // 頁籤狀態 "editor" | "history"
            const [activeTab, setActiveTab] = useState("editor");
            const [isLoading, setIsLoading] = useState(false);

            // 管理員驗證狀態 (帳號: admin / 密碼: tmhs603)
            const [isAdmin, setIsAdmin] = useState(false);
            const [showLoginModal, setShowLoginModal] = useState(false);
            const [loginUser, setLoginUser] = useState("");
            const [loginPass, setLoginPass] = useState("");
            const [loginError, setLoginError] = useState("");

            // 處理管理員登入驗證
            const handleLogin = (e) => {
                if (e) e.preventDefault();
                if (loginUser === "admin" && loginPass === "tmhs603") {
                    setIsAdmin(true);
                    setShowLoginModal(false);
                    setLoginUser("");
                    setLoginPass("");
                    setLoginError("");
                } else {
                    setLoginError("帳號或密碼錯誤！");
                }
            };

            // 處理管理員登出
            const handleLogout = () => {
                setIsAdmin(false);
            };

            // 編輯器核心狀態
            const [academicYear, setAcademicYear] = useState("115");
            const [schoolName, setSchoolName] = useState("幸福");
            const [semester, setSemester] = useState("一"); 
            
            // 依要求更新預設備註內容
            const [remarks, setRemarks] = useState(
                "1. 請授課老師依照日期與時間到達指定地點就位。\n2. 回饋單填寫完畢後請交給舉牌學生。\n3. 授課所需材料由科內統一請購。（餐飲科老師將菜單交由餐飲科助教傳真）\n4. 實習教室若有異動請提前告知實習處。"
            );

            // 實作準備與核銷資訊狀態
            const [prepTeachers, setPrepTeachers] = useState("陳國華、林美玲");
            const [prepCount, setPrepCount] = useState("15");
            const [verificationMethod, setVerificationMethod] = useState("國中核銷"); 
            
            // 授課教師集合時間與返校時間欄位
            const [assemblyTime, setAssemblyTime] = useState("13：10");
            const [returnTime, setReturnTime] = useState("16：10");

            // 每位學生材料費
            const [materialFee, setMaterialFee] = useState("200");

            // 統一上課日期與時間（整張表共用一個合併欄位）
            const [unifiedDate, setUnifiedDate] = useState("2026-10-14");
            const [unifiedTimeSlot, setUnifiedTimeSlot] = useState("13:00~15:00");

            // 表格行資料
            const [rows, setRows] = useState([
                { id: "1", group: "電機電子職群", branch: "電機科", content: "室內配線基本實務體驗", teacher: "陳國華", room: "電機實習工場", count: 15, note: "第1組" },
                { id: "2", group: "餐旅職群", branch: "烘焙科", content: "基礎西點烘焙與餅乾製作", teacher: "林美玲", room: "烘焙教室", count: 18, note: "第2組" },
                { id: "3", group: "設計職群", branch: "多媒體設計科", content: "2D動畫與角色繪製初探", teacher: "張志明", room: "電腦教室(三)", count: 12, note: "第3組" },
                { id: "4", group: "家政職群", branch: "美容美髮科", content: "時尚編髮與指甲彩繪彩妝", teacher: "黃雅婷", room: "美髮教室", count: 15, note: "" },
                { id: "5", group: "機械職群", branch: "微型機器人科", content: "樂高機器人組裝與程式操控", teacher: "戴偉倫", room: "創客教室", count: 14, note: "" },
            ]);

            // 歷史紀錄資料庫
            const [historyList, setHistoryList] = useState([]);
            const [selectedHistory, setSelectedHistory] = useState(null); 

            // 初始化：載入本地與雲端歷史資料
            useEffect(() => {
                const savedData = localStorage.getItem("vocational_table_data_v8");
                if (savedData) {
                    try {
                        const parsed = JSON.parse(savedData);
                        setAcademicYear(parsed.academicYear || "115");
                        setSchoolName(parsed.schoolName || "幸福");
                        setSemester(parsed.semester || "一");
                        setRemarks(parsed.remarks || "");
                        setRows(parsed.rows || []);
                        setPrepTeachers(parsed.prepTeachers || "陳國華、林美玲");
                        setPrepCount(parsed.prepCount || "15");
                        setVerificationMethod(parsed.verificationMethod || "國中核銷");
                        setAssemblyTime(parsed.assemblyTime || "13：10");
                        setReturnTime(parsed.returnTime || "16：10");
                        setMaterialFee(parsed.materialFee || "200");
                        setUnifiedDate(parsed.unifiedDate || "2026-10-14");
                        setUnifiedTimeSlot(parsed.unifiedTimeSlot || "13:00~15:00");
                    } catch (e) {
                        console.error("載入編輯資料失敗", e);
                    }
                }

                // 載入歷史資料列表 (優先從 Google Sheets 載入)
                fetchHistoryData();
            }, []);

            // 從 Google Sheets / 本地載入歷史資料
            const fetchHistoryData = async () => {
                if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("xxxxxxxxxx")) {
                    setIsLoading(true);
                    try {
                        const response = await fetch(`${GAS_WEB_APP_URL}?action=getHistory`);
                        if (response.ok) {
                            const data = await response.json();
                            setHistoryList(data);
                            localStorage.setItem("vocational_table_history_v8", JSON.stringify(data));
                        }
                    } catch (e) {
                        console.warn("無法連接 GAS，將載入本地暫存之歷史紀錄", e);
                        loadLocalHistory();
                    } finally {
                        setIsLoading(false);
                    }
                } else {
                    loadLocalHistory();
                }
            };

            const loadLocalHistory = () => {
                const savedHistory = localStorage.getItem("vocational_table_history_v8");

                                                                    <input 
                                                                        type="text" 
                                                                        value={unifiedTimeSlot} 
                                                                        readOnly={!isAdmin}
                                                                        onChange={(e) => {
                                                                            setUnifiedTimeSlot(e.target.value);
                                                                            saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, prepCount, verificationMethod, assemblyTime, unifiedDate, e.target.value, materialFee, returnTime);
                                                                        }}
                                                                        placeholder="例: 13:00~15:00"
                                                                        class={`border border-slate-300 rounded px-1 py-0.5 text-center bg-white outline-none w-full font-mono font-semibold ${!isAdmin ? 'cursor-not-allowed' : ''}`}
                                                                        style={{ fontSize: '14px' }}
                                                                    />
                                                                </div>
                                                            ) : (
                                                                <span class="text-rose-500 font-semibold whitespace-nowrap text-center block w-full" style={{ fontSize: '14px' }}>請選取日期</span>
                                                            )}
                                                        </div>
                                                    )}

                                                    {/* 列印專用純文字 */}
                                                    <div class="hidden print:block text-center leading-tight font-medium text-black" style={{ fontSize: '14px' }}>
                                                        <span class="font-semibold block" style={{ fontSize: '14px' }}>{rocDisplay.date}</span>
                                                        <span class="font-bold block mt-0.5" style={{ fontSize: '14px' }}>{rocDisplay.time}</span>
                                                    </div>
                                                </td>
                                            )}

                                            {/* 上課內容 */}
                                            <td class="border border-slate-300 print:border-black p-0 h-14 text-center">
                                                {selectedHistory ? (
                                                    <div class="px-2 text-gray-800 text-xs text-center">{row.content}</div>
                                                ) : (
                                                    <input 
                                                        type="text" 
                                                        value={row.content} 
                                                        readOnly={!isAdmin}
                                                        onChange={(e) => handleCellChange(row.id, "content", e.target.value)}
                                                        placeholder="授課單元內容"
                                                        class={`table-input text-center px-2 text-gray-800 ${!isAdmin ? 'cursor-not-allowed' : ''}`}
                                                    />
                                                )}
                                            </td>

                                            {/* 授課教師 */}
                                            <td class="border border-slate-300 print:border-black p-0 h-14">
                                                {selectedHistory ? (
                                                    <div class="text-center text-gray-800 font-medium px-1">{row.teacher}</div>
                                                ) : (
                                                    <input 
                                                        type="text" 
                                                        value={row.teacher} 
                                                        readOnly={!isAdmin}
                                                        onChange={(e) => handleCellChange(row.id, "teacher", e.target.value)}
                                                        placeholder="姓名"
                                                        class={`table-input font-medium text-gray-800 ${!isAdmin ? 'cursor-not-allowed' : ''}`}
                                                    />
                                                )}
                                            </td>

                                            {/* 授課教室 */}
                                            <td class="border border-slate-300 print:border-black p-0 h-14">
                                                {selectedHistory ? (
                                                    <div class="text-center text-gray-800 px-1">{row.room}</div>
                                                ) : (
                                                    <input 
                                                        type="text" 
                                                        value={row.room} 
                                                        readOnly={!isAdmin}
                                                        onChange={(e) => handleCellChange(row.id, "room", e.target.value)}
                                                        placeholder="實習教室"
                                                        class={`table-input text-gray-800 ${!isAdmin ? 'cursor-not-allowed' : ''}`}
                                                    />
                                                )}
                                            </td>

                                            {/* 人數 置中對齊 */}
                                            <td class="border border-slate-300 print:border-black p-0 h-14 text-center">
                                                {selectedHistory ? (
                                                    <div class="text-center text-gray-800 font-bold">{row.count || 0}</div>
                                                ) : (
                                                    <input 
                                                        type="number" 
                                                        value={row.count === 0 ? "" : row.count} 
                                                        readOnly={!isAdmin}
                                                        onChange={(e) => handleCellChange(row.id, "count", e.target.value)}
                                                        placeholder="0"
                                                        min="0"
                                                        class={`table-input font-bold text-gray-800 text-center ${!isAdmin ? 'cursor-not-allowed' : ''}`}
                                                    />
                                                )}
                                            </td>

                                            {/* 備註 */}
                                            <td class="border border-slate-300 print:border-black p-0 h-14">
                                                {selectedHistory ? (
                                                    <div class="text-center text-gray-600 text-xs px-1">{row.note}</div>
                                                ) : (
                                                    <input 
                                                        type="text" 
                                                        value={row.note} 
                                                        readOnly={!isAdmin}
                                                        onChange={(e) => handleCellChange(row.id, "note", e.target.value)}
                                                        placeholder=""
                                                        class={`table-input text-gray-800 ${!isAdmin ? 'cursor-not-allowed' : ''}`}
                                                    />
                                                )}
                                            </td>

                                            {/* 操作 */}
                                            <td class="no-print border border-slate-300 p-0 text-center">
                                                {selectedHistory ? null : (
                                                    isAdmin ? (
                                                        <button 
                                                            onClick={() => deleteRow(row.id)}
                                                            class="text-rose-500 hover:text-rose-700 p-1 rounded transition inline-flex items-center justify-center"
                                                            title="刪除此列"
                                                        >
                                                            <i data-lucide="trash" class="w-4 h-4"></i>
                                                        </button>
                                                    ) : (
                                                        <span class="text-slate-300 text-xs text-center block">-</span>
                                                    )
                                                )}
                                            </td>
                                        </tr>
                                    );
                                })}

                                {/* 底部人數總計行 */}
                                <tr class="print:bg-transparent">
                                    <td colSpan="5" class="border-0 print:border-0 p-0"></td>
                                    
                                    <td class="border border-slate-400 print:border-black bg-slate-100 print:bg-transparent px-2 py-2 font-bold text-center text-gray-700 print:text-black">
                                        人 數
                                    </td>
                                    
                                    <td class="border border-slate-400 print:border-black px-2 py-2 font-bold text-center text-green-700 print:text-black text-base">
                                        {selectedHistory ? selectedHistory.totalStudents : totalCount}
                                    </td>
                                    
                                    <td class="border-0 print:border-0 p-0"></td>
                                    <td class="no-print border-0 p-0"></td>
                                </tr>
                            </tbody>
                        </table>

                        {/* 實作成品準備、核銷方式及教師集合資訊欄位 (與表格等寬) */}
                        <div class="mt-4 border-2 border-slate-800 print:border-black bg-white rounded-lg p-4 space-y-4 shadow-sm print:shadow-none print:p-2">
                            
                            {/* 集合提醒 (修改雙集合時間：集合出發 & 集合返校) */}
                            <div class="text-sm text-slate-700 print:text-black leading-relaxed">
                                {selectedHistory ? (
                                    /* 歷史檢視模式 */
                                    <div class="text-xs md:text-sm">
                                        授課教師請於 <span class="font-bold border-b border-black px-3">{selectedHistory.assemblyTime || "＿＿：＿＿"}</span> 分於金容樓川堂前集合分組，帶領所屬班級前往教室；授課教師請於 <span class="font-bold border-b border-black px-3">{selectedHistory.returnTime || "＿＿：＿＿"}</span> 分於金容樓川堂前集合返校。
                                    </div>
                                ) : (
                                    /* 編輯器模式 */
                                    <div class="flex flex-wrap items-center gap-1.5 text-xs md:text-sm">
                                        <span class="font-bold text-slate-800 no-print">集合提醒：</span>
                                        <span>授課教師請於</span>
                                        <input 
                                            type="text" 
                                            value={assemblyTime} 
                                            readOnly={!isAdmin}
                                            onChange={(e) => {
                                                setAssemblyTime(e.target.value);
                                                saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, prepCount, verificationMethod, e.target.value, unifiedDate, unifiedTimeSlot, materialFee, returnTime);
                                            }}
                                            placeholder="13：10" 
                                            class={`border-b border-dashed border-slate-400 outline-none px-2 py-0.5 text-center bg-slate-50 font-semibold w-24 text-xs md:text-sm print:border-b print:border-black print:bg-transparent ${isAdmin ? 'focus:border-green-600' : 'cursor-not-allowed'}`}
                                        />
                                        <span>分於金容樓川堂前集合分組，帶領所屬班級前往教室；授課教師請於</span>
                                        <input 
                                            type="text" 
                                            value={returnTime} 
                                            readOnly={!isAdmin}
                                            onChange={(e) => {
                                                setReturnTime(e.target.value);
                                                saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, prepCount, verificationMethod, assemblyTime, unifiedDate, unifiedTimeSlot, materialFee, e.target.value);
                                            }}
                                            placeholder="16：10" 
                                            class={`border-b border-dashed border-slate-400 outline-none px-2 py-0.5 text-center bg-slate-50 font-semibold w-24 text-xs md:text-sm print:border-b print:border-black print:bg-transparent ${isAdmin ? 'focus:border-green-600' : 'cursor-not-allowed'}`}
                                        />
                                        <span>分於金容樓川堂前集合返校。</span>
                                    </div>
                                )}
                            </div>

                            {/* 成品備製上方單獨新增一列可填寫資訊欄 "每位學生材料費xxx元" */}
                            <div class="text-sm text-slate-700 print:text-black leading-relaxed border-t border-dashed border-slate-200 pt-3 print:border-none print:pt-1">
                                {selectedHistory ? (
                                    /* 歷史檢視模式 */
                                    <div class="text-xs md:text-sm">
                                        每位學生材料費 <span class="font-bold border-b border-black px-3">{selectedHistory.materialFee || "＿＿"}</span> 元。
                                    </div>
                                ) : (
                                    /* 編輯器模式 */
                                    <div class="flex flex-wrap items-center gap-1.5 text-xs md:text-sm">
                                        <span class="font-bold text-slate-800 no-print">材料費用：</span>
                                        <span>每位學生材料費</span>
                                        <input 
                                            type="text" 
                                            value={materialFee} 
                                            readOnly={!isAdmin}
                                            onChange={(e) => {
                                                setMaterialFee(e.target.value);
                                                saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, prepCount, verificationMethod, assemblyTime, unifiedDate, unifiedTimeSlot, e.target.value, returnTime);
                                            }}
                                            placeholder="200" 
                                            class={`border-b border-dashed border-slate-400 outline-none px-2 py-0.5 text-center bg-slate-50 font-bold w-20 text-xs md:text-sm print:border-b print:border-black print:bg-transparent ${isAdmin ? 'focus:border-green-600' : 'cursor-not-allowed'}`}
                                        />
                                        <span>元。</span>
                                    </div>
                                )}
                            </div>

                            {/* 實作成品準備資訊欄 */}
                            <div class="text-sm text-slate-700 print:text-black leading-relaxed border-t border-dashed border-slate-200 pt-3 print:border-none print:pt-1">
                                {selectedHistory ? (
                                    /* 歷史檢視模式 */
                                    <div class="text-xs md:text-sm">
                                        請 <span class="font-bold border-b border-black px-3">{selectedHistory.prepTeachers || "＿＿＿＿"}</span> 老師準備實作成品 <span class="font-bold border-b border-black px-3">{selectedHistory.prepCount || "＿"}</span> 份給當天國中帶隊教師。
                                    </div>
                                ) : (
                                    /* 編輯器模式 */
                                    <div class="flex flex-wrap items-center gap-1.5 text-xs md:text-sm">
                                        <span class="font-bold text-slate-800 no-print">成品備製：</span>
                                        <span>請</span>
                                        <input 
                                            type="text" 
                                            value={prepTeachers} 
                                            readOnly={!isAdmin}
                                            onChange={(e) => {
                                                setPrepTeachers(e.target.value);
                                                saveDataToLocal(academicYear, schoolName, semester, remarks, rows, e.target.value, prepCount, verificationMethod, assemblyTime, unifiedDate, unifiedTimeSlot, materialFee, returnTime);
                                            }}
                                            placeholder="請填寫授課老師" 
                                            class={`border-b border-dashed border-slate-400 outline-none px-2 py-0.5 text-center bg-slate-50 font-semibold w-56 text-xs md:text-sm print:border-b print:border-black print:bg-transparent ${isAdmin ? 'focus:border-green-600' : 'cursor-not-allowed'}`}
                                        />
                                        <span>老師準備實作成品</span>
                                        <input 
                                            type="text" 
                                            value={prepCount} 
                                            readOnly={!isAdmin}
                                            onChange={(e) => {
                                                setPrepCount(e.target.value);
                                                saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, e.target.value, verificationMethod, assemblyTime, unifiedDate, unifiedTimeSlot, materialFee, returnTime);
                                            }}
                                            placeholder="份數" 
                                            class={`border-b border-dashed border-slate-400 outline-none px-2 py-0.5 text-center bg-slate-50 font-bold w-16 text-xs md:text-sm print:border-b print:border-black print:bg-transparent ${isAdmin ? 'focus:border-green-600' : 'cursor-not-allowed'}`}
                                        />
                                        <span>份給當天國中帶隊教師。</span>
                                    </div>
                                )}
                            </div>

                            {/* 核銷方式欄 */}
                            <div class="text-sm text-slate-700 print:text-black leading-relaxed border-t border-dashed border-slate-200 pt-3 print:border-none print:pt-1">
                                {selectedHistory ? (
                                    /* 歷史檢視模式 */
                                    <div class="text-xs md:text-sm font-semibold flex items-center gap-4">
                                        <span>核銷方式：</span>
                                        <span>{selectedHistory.verificationMethod === "國中核銷" ? "☑ 國中核銷" : "☐ 國中核銷"}</span>
                                        <span>{selectedHistory.verificationMethod === "本校核銷" ? "☑ 本校核銷" : "☐ 本校核銷"}</span>
                                    </div>
                                ) : (
                                    /* 編輯器模式 */
                                    <div class="flex flex-wrap items-center gap-4 text-xs md:text-sm">
                                        <span class="font-bold text-slate-800">核銷方式：</span>
                                        
                                        {/* 網頁端單選鈕 */}
                                        <div class="no-print flex items-center gap-4">
                                            <label class={`flex items-center gap-1.5 ${isAdmin ? 'cursor-pointer' : 'cursor-not-allowed opacity-75'}`}>
                                                <input 
                                                    type="radio" 
                                                    name="verifMethod" 
                                                    value="國中核銷" 
                                                    disabled={!isAdmin}
                                                    checked={verificationMethod === "國中核銷"} 
                                                    onChange={(e) => {
                                                        setVerificationMethod(e.target.value);
                                                        saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, prepCount, e.target.value, assemblyTime, unifiedDate, unifiedTimeSlot, materialFee, returnTime);
                                                    }}
                                                    class="text-green-600 focus:ring-green-500 w-4 h-4"
                                                />
                                                <span class="font-medium">國中核銷</span>
                                            </label>
                                            <label class={`flex items-center gap-1.5 ${isAdmin ? 'cursor-pointer' : 'cursor-not-allowed opacity-75'}`}>
                                                <input 
                                                    type="radio" 
                                                    name="verifMethod" 
                                                    value="本校核銷" 
                                                    disabled={!isAdmin}
                                                    checked={verificationMethod === "本校核銷"} 
                                                    onChange={(e) => {
                                                        setVerificationMethod(e.target.value);
                                                        saveDataToLocal(academicYear, schoolName, semester, remarks, rows, prepTeachers, prepCount, e.target.value, assemblyTime, unifiedDate, unifiedTimeSlot, materialFee, returnTime);
                                                    }}
                                                    class="text-green-600 focus:ring-green-500 w-4 h-4"
                                                />
                                                <span class="font-medium">本校核銷</span>
                                            </label>
                                        </div>

                                        {/* 列印端純文字方塊樣式 */}
                                        <div class="hidden print:flex items-center gap-6">
                                            <span>{verificationMethod === "國中核銷" ? "☑ 國中核銷" : "☐ 國中核銷"}</span>
                                            <span>{verificationMethod === "本校核銷" ? "☑ 本校核銷" : "☐ 本校核銷"}</span>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 與表格等寬的整合大備註說明欄位 */}
                        <div class="mt-4 border border-slate-400 print:border-black bg-white rounded-lg p-3 text-left w-full shadow-xs print:shadow-none">
                            <div class="font-bold text-slate-700 print:text-black mb-1.5 flex items-center gap-1.5 text-xs md:text-sm no-print">
                                <i data-lucide="clipboard-list" class="w-4 h-4 text-green-600"></i>
                                <span>整張報表備註與補充說明 (將與表格同寬列印)：</span>
                            </div>
                            
                            {selectedHistory ? (
                                /* 歷史檢視模式 */
                                <div class="text-xs text-slate-800 print:text-black whitespace-pre-line leading-relaxed min-h-[50px] font-medium">
                                    {selectedHistory.remarks || "（無備註內容）"}
                                </div>
                            ) : (
                                /* 編輯器模式 */
                                <textarea
                                    value={remarks}
                                    readOnly={!isAdmin}
                                    onChange={(e) => {
                                        setRemarks(e.target.value);
                                        saveDataToLocal(academicYear, schoolName, semester, e.target.value, rows, prepTeachers, prepCount, verificationMethod, assemblyTime, unifiedDate, unifiedTimeSlot, materialFee, returnTime);
                                    }}
                                    placeholder="在此輸入這張報表底部的整體備註事項..."
                                    rows="5"
                                    class={`w-full text-xs md:text-sm p-2 border border-slate-200 rounded outline-none resize-y text-slate-700 print:text-black print:border-none print:p-0 leading-relaxed bg-slate-50/50 transition-all font-mono ${isAdmin ? 'focus:border-green-500 focus:bg-white' : 'cursor-not-allowed bg-slate-100/50'}`}
                                />
                            )}
                        </div>

                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
